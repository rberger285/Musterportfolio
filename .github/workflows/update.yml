name: Update prices

on:
  schedule:
    - cron: "30 20 * * 1-5"   # weekdays after Xetra close (22:30 CEST / 21:30 CET)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_prices.py
      - name: Commit new prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
